<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/src/style.css"/>
    <title>frontend</title>
</head>
<body>
<div id="app">
    <form id="todo-submit-form">
        <label for="todo-input">
            <input id="todo-input" type="text" name="todo-input" value="">
        </label>
        <button id="submit-btn" type="submit">Add</button>
    </form>

    <section id="todo-container">
        <div id="open_container">
            <h3>OPEN</h3>
            <ul class="open_todos"></ul>
        </div>
        <div id="progress_container">
            <h3>Progress</h3>
            <ul class="progress_todos"></ul>
        </div>
        <div id="blocked_container"><h3>Blocked</h3>
            <ul class="blocked_todos"></ul>
        </div>
        <div id="done_container"><h3>Done</h3>
            <ul class="done_todos"></ul>
        </div>
    </section>

</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
